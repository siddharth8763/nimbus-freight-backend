spring:
  datasource:
    url: jdbc:h2:file:./.data/nimbus-dev;MODE=MySQL;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: none
  sql:
    init:
      mode: always

nimbus:
  seed-path: classpath:seed/sensor_readings.json
