server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/nimbus?createDatabaseIfNotExist=true&serverTimezone=UTC
    username: nimbus
    password: nimbus
  sql:
    init:
      mode: always
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  jackson:
    serialization:
      write-dates-as-timestamps: false

nimbus:
  seed-path: classpath:seed/sensor_readings.json
  alert:
    threshold-high-c: "8.0"
    threshold-high-resolve-c: "7.0"
    threshold-freeze-c: "2.0"
    threshold-freeze-resolve-c: "3.0"
    sustain-duration-minutes: 15
    resolve-duration-minutes: 10
    gap-reset-minutes: 30
    min-valid-temp-c: "-50"
    max-valid-temp-c: "50"
  llm:
    api-key: ${LLM_API_KEY:${OPENAI_API_KEY:}}
    model: ${LLM_MODEL:gpt-4o-mini}
    base-url: ${LLM_BASE_URL:https://api.openai.com/v1}
    provider: openai
