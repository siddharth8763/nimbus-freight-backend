spring:
  datasource:
    url: jdbc:h2:mem:nimbus;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: none
  sql:
    init:
      mode: always

nimbus:
  seed-path: classpath:seed/sensor_readings.json
  llm:
    api-key: ""
